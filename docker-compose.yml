services:
  mysql:
    image: mysql:8.4
    container_name: aetherpass-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aetherpass
      MYSQL_USER: aetherpass
      MYSQL_PASSWORD: aetherpass
    ports:
      - "3306:3306"
    volumes:
      - aetherpass_mysql_data:/var/lib/mysql
      - ./database/schema/001_init_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed/001_seed_roles_users_venues.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uaetherpass", "-paetherpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: aetherpass-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aetherpass_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: aetherpass-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: aetherpass
      RABBITMQ_DEFAULT_PASS: aetherpass
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - aetherpass_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  aetherpass_mysql_data:
  aetherpass_redis_data:
  aetherpass_rabbitmq_data:
