spring:
  application:
    name: aetherpass-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:aetherpass}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:aetherpass}
    password: ${DB_PASSWORD:aetherpass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:aetherpass}
    password: ${RABBITMQ_PASSWORD:aetherpass}

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

aetherpass:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-very-long-secure-secret-key-at-least-256-bits}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  seat-lock:
    ttl-seconds: 300
  payments:
    # MOCK = local demo (no Razorpay keys). Set RAZORPAY + keys for real checkout.
    provider: ${PAYMENTS_PROVIDER:MOCK}
    razorpay-key-id: ${RAZORPAY_KEY_ID:}
    razorpay-key-secret: ${RAZORPAY_KEY_SECRET:}
    razorpay-webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  tickets:
    output-dir: ${TICKETS_OUTPUT_DIR:tickets}
  cors:
    # Comma-separated. Include every Next.js origin you use in local/dev.
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}
  app:
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
  password-reset:
    expiry-ms: ${PASSWORD_RESET_EXPIRY_MS:1800000}
  cache:
    event-browse-ttl-seconds: ${EVENT_BROWSE_CACHE_TTL:60}
    event-detail-ttl-seconds: ${EVENT_DETAIL_CACHE_TTL:300}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.aetherpass: INFO
    org.springframework.security: INFO
